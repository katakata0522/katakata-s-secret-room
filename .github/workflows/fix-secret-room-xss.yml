name: One-time BBS XSS fix

on:
  push:
    branches:
      - fix/secret-room-bbs-xss
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/secret-room-bbs-xss

      - name: Patch broken HTML escaping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          start_marker = '    function escapeHtml(unsafe)'
          end_marker = '    function displayPosts()'

          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('escapeHtml boundary was not found; refusing to modify unrelated code.')

          vulnerable_block = source[start:end]
          required_signatures = (
              '.replace(/</g, "<")',
              '.replace(/>/g, ">")',
              'bbsPostsContainer'
          )
          if not all(signature in source for signature in required_signatures):
              raise SystemExit('Expected vulnerable source-to-sink signatures were not found.')

          fixed = """    function escapeHtml(unsafe) {
              if (typeof unsafe !== 'string') return '';
              const htmlEntities = {
                  '&': '&amp;',
                  '<': '&lt;',
                  '>': '&gt;',
                  '"': '&quot;',
                  "'": '&#39;'
              };
              return unsafe.replace(/[&<>"']/g, char => htmlEntities[char]);
          }
          """

          path.write_text(source[:start] + fixed + source[end:], encoding='utf-8')
          print(f'Replaced vulnerable block ({len(vulnerable_block)} characters).')
          PY

      - name: Verify security boundary and normal text
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/function escapeHtml\(unsafe\) \{[\s\S]*?\n    \}/);
          if (!match) throw new Error('escapeHtml function not found');

          const escapeHtml = new Function(`${match[0]}; return escapeHtml;`)();
          const payload = `<img src=x onerror="globalThis.__xss=1"> & ' "`;
          const escaped = escapeHtml(payload);
          const expected = '&lt;img src=x onerror=&quot;globalThis.__xss=1&quot;&gt; &amp; &#39; &quot;';

          if (escaped !== expected) {
            throw new Error(`Malicious payload was not escaped correctly: ${escaped}`);
          }
          if (/[<>]/.test(escaped)) {
            throw new Error('Escaped output still contains executable tag delimiters');
          }

          const normal = escapeHtml('こんにちは、秘密基地です！');
          if (normal !== 'こんにちは、秘密基地です！') {
            throw new Error('Normal Japanese text was changed');
          }

          if (html.includes('.replace(/</g, "<")') || html.includes('.replace(/>/g, ">")')) {
            throw new Error('Vulnerable no-op escaping remains');
          }

          console.log('PASS: stored BBS content is escaped and normal Japanese text is preserved.');
          NODE

      - name: Commit verified fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-secret-room-xss.yml
          git add index.html
          git commit -m "security: 掲示板投稿の保存型XSSを修正"
          git push origin HEAD:fix/secret-room-bbs-xss
